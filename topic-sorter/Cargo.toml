[package]
name = "topic-sorter"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
llm-worker-common = { path = "../llm-worker-common" }
tokio = { workspace = true }
sqlx = { workspace = true }
unidb = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
async-openai = { version = "0.38", features = [
    "chat-completion",
    "native-tls",
] }

[dev-dependencies]
llm-worker-common = { path = "../llm-worker-common", features = ["test-support"] }
wiremock = "0.6"
proptest = "1"

[[bin]]
name = "topic-sorter"
path = "src/main.rs"
# main.rs is a thin wrapper without tests; avoid building an empty test binary
test = false
