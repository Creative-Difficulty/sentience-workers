x-worker: &worker
    env_file: .env
    networks: [sentience]
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "test", "-f", "/tmp/ready"]
        interval: 10s
        timeout: 3s
        retries: 5
        start_period: 60s
    profiles: [app]

x-database-url: &database-url
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sentience}

x-postgres-dep: &postgres-dep
    postgres:
        condition: service_healthy

services:
    # ─── RustFS S3-compatible object storage ───────────────────────────
    rustfs:
        image: rustfs/rustfs:latest
        container_name: rustfs-s3
        security_opt: ["no-new-privileges:true"]
        # S3 API (9000) is reachable in-network as rustfs:9000; only the
        # admin console (9001) is published to the host.
        ports:
            - "9001:9001"
        environment:
            RUSTFS_VOLUMES: /data/rustfs0
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_CORS_ALLOWED_ORIGINS: "*"
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-devadmin}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            RUSTFS_OBS_LOGGER_LEVEL: debug
            RUSTFS_OBS_LOG_DIRECTORY: /logs
        volumes:
            - rustfs_data:/data
            - rustfs_logs:/logs
        networks: [sentience]
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    postgres:
        build:
            context: ./docker/postgres
            args:
                UNIDB_REF: ${UNIDB_REF:-main}
        container_name: sentience-postgres
        ports: ["5432:5432"]
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-sentience}
        volumes:
            - pg_data:/var/lib/postgresql/data
        networks: [sentience]
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # ─── RustFS bucket bootstrap (one-shot) ────────────────────────────
    rustfs-bucket-init:
        image: amazon/aws-cli:latest
        container_name: rustfs-bucket-init
        depends_on:
            rustfs:
                condition: service_healthy
        networks: [sentience]
        environment:
            AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-devadmin}
            AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            AWS_DEFAULT_REGION: us-east-1
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "${S3_BUCKET_NAME:-sentience}" 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "${S3_BUCKET_NAME:-sentience}"


        restart: "no"
        profiles: [app]

    ingest-vestibule-retriever:
        <<: *worker
        container_name: ingest-vestibule-retriever
        build:
            context: .
            target: ingest-vestibule-retriever
        environment:
            <<: *database-url
            S3_URL: http://rustfs:9000/
            S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-devadmin}
            S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            RUST_LOG: ${RUST_LOG:-ingest_vestibule_retriever=debug}
        depends_on:
            <<: *postgres-dep
            rustfs:
                condition: service_healthy
            rustfs-bucket-init:
                condition: service_completed_successfully

    topic-sorter:
        <<: *worker
        container_name: topic-sorter
        build:
            context: .
            target: topic-sorter
        environment:
            <<: *database-url
            RUST_LOG: ${RUST_LOG:-topic_sorter=debug}
        depends_on: *postgres-dep

    # ─── Fact Extractor ────────────────────────────────────────────────
    fact-extractor:
        <<: *worker
        container_name: fact-extractor
        build:
            context: .
            target: fact-extractor
        environment:
            <<: *database-url
            RUST_LOG: ${RUST_LOG:-fact_extractor=debug}
        depends_on: *postgres-dep

networks:
    sentience:
        driver: bridge

volumes:
    rustfs_data:
    rustfs_logs:
    pg_data:
