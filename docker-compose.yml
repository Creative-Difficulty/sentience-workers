# Sentience stack.
#
# Local / dev (no secrets, no .env needed):
#   docker compose up -d --wait        # or: make up
#   -> postgres (+unidb schema), rustfs + bucket, mock LLM, fact-extractor,
#      topic-sorter and the dashboard on http://127.0.0.1:3000
#   make seed                          # optional synthetic data
#
# Real deployment:
#   cp .env.example .env   # fill in LLM_*, DISCORD_*, RustFS keys
#   docker compose --profile app up -d
#   (`app` adds the Discord ingester, which needs DISCORD_TOKEN; the
#    `discord` profile is an alias. When LLM_BASE_URL is unset or empty the
#    workers talk to the bundled mock LLM instead of a real provider.)
#
# Host ports are bound to 127.0.0.1 by default (the defaults below use
# well-known dev credentials). Override with POSTGRES_PUBLISH / RUSTFS_CONSOLE_PUBLISH,
# e.g. POSTGRES_PUBLISH=0.0.0.0:5432 to expose Postgres on all interfaces.

x-worker: &worker
    # .env is optional: compose must not fail on a fresh clone without one.
    env_file:
        - path: .env
          required: false
    networks: [sentience]
    restart: unless-stopped
    # Run an init as PID 1 so SIGTERM from `docker compose stop` reaches the
    # service (a bare PID 1 without a handler ignores SIGTERM -> 10s SIGKILL).
    init: true
    security_opt: ["no-new-privileges:true"]
    # NOTE: the services write /tmp/ready right after start-up (before their
    # first DB poll / Discord login succeed), so this only proves the process
    # got that far, not that it is actually healthy.
    healthcheck:
        test: ["CMD", "test", "-f", "/tmp/ready"]
        interval: 10s
        timeout: 3s
        retries: 5
        start_period: 60s

x-llm-env: &llm-env
    LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-llm:8080/v1}
    LLM_API_KEY: ${LLM_API_KEY:-mock}
    LLM_MODEL: ${LLM_MODEL:-mock}
    DISCORD_SERVER_NAME: ${DISCORD_SERVER_NAME:-Sentience Dev}

x-worker-build: &worker-build
    context: .
    # Local unidb-schema checkout (with .git) to build the `unidb` git
    # dependency from instead of github.com; see Dockerfile.
    additional_contexts:
        unidb: ${UNIDB_CONTEXT:-https://github.com/Vimothy-s-Vestibule/unidb-schema.git#a7a7c55458aef4f1bef899c4527af3559a925033}

x-database-url: &database-url
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sentience}

x-postgres-dep: &postgres-dep
    postgres:
        condition: service_healthy

services:
    # ─── RustFS S3-compatible object storage ───────────────────────────
    rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        security_opt: ["no-new-privileges:true"]
        # S3 API (9000) is reachable in-network as rustfs:9000; only the
        # admin console (9001) is published to the host (loopback by default).
        ports:
            - "${RUSTFS_CONSOLE_PUBLISH:-127.0.0.1:9001}:9001"
        environment:
            RUSTFS_VOLUMES: /data/rustfs0
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_CORS_ALLOWED_ORIGINS: "*"
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-devadmin}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
            RUSTFS_OBS_LOG_DIRECTORY: /logs
        volumes:
            - rustfs_data:/data
            - rustfs_logs:/logs
        networks: [sentience]
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    postgres:
        build:
            context: ./docker/postgres
            args:
                # unidb-schema commit baked into the image. Keep it equal to the
                # `unidb` rev in Cargo.lock so the schema matches the compiled models.
                UNIDB_REF: ${UNIDB_REF:-a7a7c55458aef4f1bef899c4527af3559a925033}
            # Optional: UNIDB_CONTEXT=../unidb-schema builds from a local checkout.
            additional_contexts:
                unidb: ${UNIDB_CONTEXT:-https://github.com/Vimothy-s-Vestibule/unidb-schema.git#${UNIDB_REF:-a7a7c55458aef4f1bef899c4527af3559a925033}}
        ports: ["${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"]
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-sentience}
        volumes:
            - pg_data:/var/lib/postgresql/data
        networks: [sentience]
        restart: unless-stopped
        healthcheck:
            # -d: the target DB must exist (initdb scripts done), not just the server.
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentience}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # ─── RustFS bucket bootstrap (one-shot) ────────────────────────────
    rustfs-bucket-init:
        image: amazon/aws-cli:2.39.4@sha256:0aa3ae3c685574d7adc27fb19a0e1f192aa07b1487c16bd3ad03253b6de521ae
        depends_on:
            rustfs:
                condition: service_healthy
        networks: [sentience]
        environment:
            AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-devadmin}
            AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            AWS_DEFAULT_REGION: us-east-1
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >
                aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "${S3_BUCKET_NAME:-sentience}" 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "${S3_BUCKET_NAME:-sentience}"
        restart: "no"

    ingest-vestibule-retriever:
        <<: *worker
        # Needs a real DISCORD_TOKEN / GUILD_ID, so it is opt-in.
        profiles: [app, discord]
        build:
            <<: *worker-build
            target: ingest-vestibule-retriever
        environment:
            <<: *database-url
            S3_URL: http://rustfs:9000/
            S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-devadmin}
            S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-devadmin}
            S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sentience}
            RUST_LOG: ${RUST_LOG:-ingest_vestibule_retriever=debug}
        depends_on:
            <<: *postgres-dep
            rustfs:
                condition: service_healthy
            rustfs-bucket-init:
                condition: service_completed_successfully

    topic-sorter:
        <<: *worker
        build:
            <<: *worker-build
            target: topic-sorter
        environment:
            <<: [*database-url, *llm-env]
            RUST_LOG: ${RUST_LOG:-topic_sorter=debug}
        depends_on: &llm-worker-deps
            <<: *postgres-dep
            mock-llm:
                condition: service_healthy

    # ─── Fact Extractor ────────────────────────────────────────────────
    fact-extractor:
        <<: *worker
        build:
            <<: *worker-build
            target: fact-extractor
        environment:
            <<: [*database-url, *llm-env]
            RUST_LOG: ${RUST_LOG:-fact_extractor=debug}
        depends_on: *llm-worker-deps

    # ─── Mock LLM (OpenAI-compatible, deterministic; dev/e2e only) ─────
    # Used whenever LLM_BASE_URL is not set. Not published to the host.
    mock-llm:
        build: ./docker/mock-llm
        networks: [sentience]
        restart: unless-stopped
        security_opt: ["no-new-privileges:true"]
        environment:
            MOCK_LLM_QUIET: ${MOCK_LLM_QUIET:-1}

    # ─── Dashboard (Sentience-dash) ────────────────────────────────────
    # Built straight from its git repo by default; DASH_CONTEXT=../Sentience-dash
    # builds a local checkout instead.
    dash:
        build:
            context: ${DASH_CONTEXT:-https://github.com/Creative-Difficulty/Sentience-dash.git#main}
        ports: ["${DASH_PUBLISH:-127.0.0.1:3000}:3000"]
        environment:
            <<: *database-url
        depends_on: *postgres-dep
        networks: [sentience]
        restart: unless-stopped
        security_opt: ["no-new-privileges:true"]
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 15s

networks:
    sentience:
        driver: bridge

volumes:
    rustfs_data:
    rustfs_logs:
    pg_data:
